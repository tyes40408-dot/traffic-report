<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>三寶上傳區</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- Google AdSense 程式碼 -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3282466760700255" crossorigin="anonymous"></script>

  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 30px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
    
    .ad-banner {
      width: 100%;
      background: #f1f3f5;
      border: 1px dashed #adb5bd;
      border-radius: 6px;
      padding: 15px;
      text-align: center;
      color: #6c757d;
      font-size: 14px;
      box-sizing: border-box;
      margin-bottom: 20px;
    }
    .ad-banner img { max-width: 100%; height: auto; border-radius: 4px; display: block; margin: 0 auto; }

    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input[type="text"], select, textarea, input[type="file"] { width: 100%; padding: 8px; box-sizing: border-box; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; }
    button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
    button:disabled { background-color: #aaa; }
    #status { margin-top: 15px; font-weight: bold; color: #333; }
    hr { margin: 30px 0; border: 0; border-top: 1px solid #ddd; }
    .report-card { border: 1px solid #eee; padding: 15px; margin-bottom: 15px; border-radius: 6px; background: #fafafa; }
    .report-card img { width: 100%; max-height: 350px; object-fit: contain; margin-top: 10px; border-radius: 4px; display: block; }
    .report-card video { width: 100%; max-height: 350px; margin-top: 10px; border-radius: 4px; display: block; background: #000; }
    .search-box { display: flex; gap: 10px; margin-bottom: 15px; }
    .search-box input { flex: 1; }
    .search-box button { width: auto; padding: 8px 16px; background-color: #28a745; }
    .error-msg { color: #d9534f; font-size: 14px; margin-top: 4px; display: none; }
  </style>
</head>
<body>

  <!-- 頂部橫幅廣告區 -->
  <div class="ad-banner" id="ad-top">
    <span>📢 廣告贊助區（可放置 Google 廣告或宣傳圖片）</span>
  </div>

  <h2>三寶上傳區</h2>

  <form id="reportForm">
    <div class="form-group">
      <label for="carNumber">車牌號碼</label>
      <input type="text" id="carNumber" placeholder="例如：ABC-1234 或 1234-AB" required>
      <div id="carNumberError" class="error-msg">請輸入正確的車牌號碼格式（例：ABC-1234 或 1234-AB）</div>
    </div>

    <div class="form-group">
      <label for="violationType">違規事實</label>
      <select id="violationType" required>
        <option value="">-- 請選擇違規項目 --</option>
        
        <!-- 一般道路違規事項 -->
        <option value="闖紅燈、紅燈右轉">闖紅燈、紅燈右轉</option>
        <option value="車輛不暫停讓行人">車輛不暫停讓行人</option>
        <option value="車輛不暫停讓視覺功能障礙者">車輛不暫停讓視覺功能障礙者</option>
        <option value="迫近、突然變換車道、迫使他車讓道(逼車)">迫近、突然變換車道、迫使他車讓道(逼車)</option>
        <option value="危險駕駛或蛇行">危險駕駛或蛇行</option>
        <option value="任意驟然減速、煞車或暫停">任意驟然減速、煞車或暫停</option>
        <option value="二車以上競駛競技">二車以上競駛競技</option>
        <option value="併排停車">併排停車</option>
        <option value="人行道、行人穿越道違規停車">人行道、行人穿越道違規停車</option>
        <option value="人行道、行人穿越道違規臨時停車">人行道、行人穿越道違規臨時停車</option>
        <option value="於身心障礙專用停車位違規停車">於身心障礙專用停車位違規停車</option>
        <option value="不依順行方向臨時停車">不依順行方向臨時停車</option>
        <option value="不依順行方向停車">不依順行方向停車</option>
        <option value="不依標誌標線號誌指示轉彎或變換車道">不依標誌標線號誌指示轉彎或變換車道</option>
        <option value="不遵守道路交通標誌、標線、號誌之指示">不遵守道路交通標誌、標線、號誌之指示</option>
        <option value="不按遵行之方向行駛(單行道)">不按遵行之方向行駛(單行道)</option>
        <option value="不依規定駛入來車道">不依規定駛入來車道</option>
        <option value="多車道未依規定駕車">多車道未依規定駕車</option>
        <option value="多車道轉彎未依規定">多車道轉彎未依規定</option>
        <option value="直行車佔用轉彎專用車道">直行車佔用轉彎專用車道</option>
        <option value="設有快慢車道分隔島未依規定轉彎">設有快慢車道分隔島未依規定轉彎</option>
        <option value="違規超車">違規超車</option>
        <option value="違規迴車">違規迴車</option>
        <option value="駕車行駛人行道">駕車行駛人行道</option>
        <option value="佔用自行車專用道">佔用自行車專用道</option>
        <option value="機車未依規定車道行駛(如行駛禁行機車道)">機車未依規定車道行駛(如行駛禁行機車道)</option>
        <option value="機車駕駛人或附載座人未依規定戴安全帽">機車駕駛人或附載座人未依規定戴安全帽</option>
        <option value="手持行動電話">手持行動電話</option>
        <option value="不依規定使用燈光">不依規定使用燈光</option>
        <option value="行近未設行車管制號誌之行人穿越道，不減速慢行">行近未設行車管制號誌之行人穿越道，不減速慢行</option>
        <option value="起駛前不讓行進中之車輛、行人優先通行">起駛前不讓行進中之車輛、行人優先通行</option>
        <option value="不注意來、往行人，或轉彎前未減速慢行">不注意來、往行人，或轉彎前未減速慢行</option>
        <option value="汽車所載貨物滲漏、飛散、脫落、掉落">汽車所載貨物滲漏、飛散、脫落、掉落</option>
        <option value="載運乘客、貨物不穩妥，行駛時顯有危險">載運乘客、貨物不穩妥，行駛時顯有危險</option>
        <option value="車輛機件、設備、附著物不穩妥或脫落">車輛機件、設備、附著物不穩妥或脫落</option>
        <option value="開警備車、消防車、救護車未依規定避讓">開警備車、消防車、救護車未依規定避讓</option>
        <option value="開消防車、救護車、警備車、工程救險車、毒性化學物質災害事故應變車之警號，在後跟隨急駛，或駛過在救火時處置路上之消防水帶">開消防車、救護車、警備車、工程救險車、毒性化學物質災害事故應變車之警號，在後跟隨急駛，或駛過在救火時處置路上之消防水帶</option>
        <option value="行經大眾捷運系統共用號誌路口闖紅燈、右轉">行經大眾捷運系統共用號誌路口闖紅燈、右轉</option>
        <option value="違規行駛鐵路平交道">違規行駛鐵路平交道</option>

        <!-- 高、快速公路違規事項 -->
        <option value="(高、快速公路)不依規定使用燈光">(高、快速公路)不依規定使用燈光</option>
        <option value="(快速公路)未保持安全距離">(快速公路)未保持安全距離</option>
        <option value="(快速公路)未依規定使用車道">(快速公路)未依規定使用車道</option>
        <option value="(快速公路)未依規定變換車道">(快速公路)未依規定變換車道</option>
        <option value="(快速公路)違規超車、迴車、倒車、逆向行駛">(快速公路)違規超車、迴車、倒車、逆向行駛</option>
        <option value="(快速公路)未依規定使用路肩">(快速公路)未依規定使用路肩</option>
        <option value="(快速公路)裝載貨物未覆蓋捆紮">(快速公路)裝載貨物未覆蓋捆紮</option>
        <option value="(快速公路)未依標誌標線號誌行車">(快速公路)未依標誌標線號誌行車</option>
        <option value="(快速公路)行駛禁行路段">(快速公路)行駛禁行路段</option>
        <option value="(快速公路)連續按鳴喇叭、變換燈光或其他方式迫使前車讓道">(快速公路)連續按鳴喇叭、變換燈光或其他方式迫使前車讓道</option>
        <option value="(快速公路)向車外丟棄物品">(快速公路)向車外丟棄物品</option>
        <option value="人員、車輛、動力機械違規進入快速公路">人員、車輛、動力機械違規進入快速公路</option>
      </select>
    </div>

    <div class="form-group">
      <label for="extraRemark">補充說明（選填）</label>
      <textarea id="extraRemark" rows="2" placeholder="請輸入上述違規事實之補充說明（例：17:30 第一台灰色車輛、跨越雙黃線逆向）"></textarea>
    </div>

    <div class="form-group">
      <label for="mediaFile">違規影片/照片上傳</label>
      <input type="file" id="mediaFile" accept="image/*,video/*" required>
    </div>

    <button type="submit" id="submitBtn">提交檢舉</button>
  </form>

  <div id="status"></div>

  <!-- 中間橫幅廣告區 -->
  <div class="ad-banner" id="ad-middle" style="margin-top: 30px;">
    <span>📢 廣告位置 2</span>
  </div>

  <hr>

  <h3>🔍 違規紀錄查詢</h3>
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="輸入車牌號碼搜尋 (例：ABD-1522)">
    <button type="button" onclick="searchReports()">查詢</button>
  </div>
  <button type="button" onclick="loadReports('')" style="background-color: #6c757d; margin-bottom: 20px;">顯示全部紀錄</button>

  <div id="reportsList"></div>

  <script>
    const SUPABASE_URL = "https://wnnqvhayptbulmrelidu.supabase.co"; 
    const SUPABASE_ANON_KEY = "sb_publishable_TEguzGuhDPzc8bbXri9Q_5oxfA"; 
    
    var supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const reportForm = document.getElementById('reportForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusDiv = document.getElementById('status');
    const carNumberInput = document.getElementById('carNumber');
    const carNumberError = document.getElementById('carNumberError');

    function validateCarNumber(carNum) {
      const regex = /^[A-Z0-9]{2,4}-[A-Z0-9]{2,4}$/i;
      return regex.test(carNum.trim());
    }

    reportForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const carNumber = carNumberInput.value.trim().toUpperCase();
      const violationType = document.getElementById('violationType').value;
      const extraRemark = document.getElementById('extraRemark').value.trim();
      const mediaFile = document.getElementById('mediaFile').files[0];

      if (!validateCarNumber(carNumber)) {
        carNumberError.style.display = 'block';
        return;
      } else {
        carNumberError.style.display = 'none';
      }

      let fullDescription = violationType;
      if (extraRemark) {
        fullDescription += `（${extraRemark}）`;
      }

      submitBtn.disabled = true;
      submitBtn.innerText = '上傳中...';
      statusDiv.innerText = '';

      try {
        const fileExt = mediaFile.name.split('.').pop();
        const fileName = `${Date.now()}_${Math.random().toString(36).substring(2, 8)}.${fileExt}`;
        const filePath = `${fileName}`;

        // 上傳到 Supabase 存儲桶 video-uploads
        const { data: uploadData, error: uploadError } = await supabase.storage
          .from('video-uploads')
          .upload(filePath, mediaFile);

        if (uploadError) throw uploadError;

        const { data: urlData } = supabase.storage
          .from('video-uploads')
          .getPublicUrl(filePath);

        const publicUrl = urlData.publicUrl;

        // 寫入 Supabase reports 表格
        const { error: dbError } = await supabase
          .from('reports')
          .insert([
            {
              license_plate: carNumber,
              description: fullDescription,
              video_url: publicUrl
            }
          ]);

        if (dbError) throw dbError;

        statusDiv.style.color = 'green';
        statusDiv.innerText = '✅ 檢舉已成功提交！';
        reportForm.reset();
        loadReports();

      } catch (err) {
        console.error(err);
        statusDiv.style.color = 'red';
        statusDiv.innerText = '❌ 提交失敗：' + (err.message || '請重新再試');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = '提交檢舉';
      }
    });

    // 載入與搜尋紀錄
    async function loadReports(query = '') {
      const reportsList = document.getElementById('reportsList');
      reportsList.innerHTML = '載入中...';

      let dbQuery = supabase
        .from('reports')
        .select('*')
        .order('created_at', { ascending: false });

      if (query) {
        dbQuery = dbQuery.ilike('license_plate', `%${query.trim()}%`);
      }

      const { data, error } = await dbQuery;

      if (error) {
        console.error(error);
        reportsList.innerHTML = '無法載入紀錄。';
        return;
      }

      if (!data || data.length === 0) {
        reportsList.innerHTML = '<p>查無相關違規紀錄。</p>';
        return;
      }

      reportsList.innerHTML = '';
      data.forEach(item => {
        const card = document.createElement('div');
        card.className = 'report-card';
        
        let mediaHtml = '';
        if (item.video_url) {
          const isVideo = item.video_url.match(/\.(mp4|webm|ogg|mov)$/i);
          if (isVideo) {
            mediaHtml = `<video src="${item.video_url}" controls></video>`;
          } else {
            mediaHtml = `<img src="${item.video_url}" alt="違規照片">`;
          }
        }

        card.innerHTML = `
          <strong>車牌：</strong> ${item.license_plate || '無'}<br>
          <strong>描述：</strong> ${item.description || '無'}<br>
          ${mediaHtml}
        `;
        reportsList.appendChild(card);
      });
    }

    // 頁面載入時自動讀取
    loadReports();

    function searchReports() {
      const query = document.getElementById('searchInput').value;
      loadReports(query);
    }
  </script>
</body>
</html>
